name: ci

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: tehw0lf/workflows/.github/workflows/build-test-publish.yml@main
    # A reusable workflow can only use permissions the caller grants it, and the
    # permission check runs before any job condition is evaluated. So every job
    # build-test-publish nests has to be satisfied here, including ones a Lua
    # addon never actually runs - npm-audit-autofix needs pull-requests: write
    # even though nothing here is an npm project. Granting less fails the run at
    # startup in about a second, and the reason is only visible in the web UI, not
    # via the API or run logs.
    permissions:
      actions: write         # test-and-build, release-github
      attestations: write    # test-and-build
      contents: write        # release-github, set-git-tag
      packages: write        # nested jobs request packages: read
      id-token: write        # required throughout
      security-events: write # SARIF uploads from security scanning
      pull-requests: write   # npm-audit-autofix
    with:
      # Lua is provisioned as a toolchain; `bash` stays the dispatcher, since the
      # tool input is prefixed onto every script command.
      tool: bash
      enable_lua: true
      # WoW 3.3.5a runs Lua 5.1. Testing against a newer interpreter would accept
      # syntax the game rejects, so the version is pinned exactly.
      lua_version: "5.1.5"

      test: "./test/run.sh"

      # Only main produces the packaged addon, so pull requests run the suite and
      # stop there. release_github is additionally gated on the event being a
      # push, so a PR cannot publish even if it built.
      build_main: "./build.sh"
      artifact_path: "dist"
      publish_github_release: true
